services:
  - type: web
    name: trading-terminal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: KRAKEN_REST_BASE_URL
        value: https://api.kraken.com
      - key: DATABASE_URL
        sync: false
